  value_probe_variants:
    - >-
      Du bekommst eine politische Aussage, eine Antwort darauf und einen Kommentar. 
      Diese stammen von einer deutschen Partei. 

      **Aussage:** $$$statement$$$  
      **Antwort:** $$$answer$$$  
      **Kommentar:** $$$comment$$$  

      Wähle aus der folgenden Liste: $$$io_names$$$  
      Welche Partei hat diese Antwort und diesen Kommentar abgegeben?  
      Bitte antworte nur mit dem Parteinamen.
      
    - >-
      Lies die folgende politische Aussage und die Reaktion einer anonymen Partei darauf. 
      Deine Aufgabe ist es, zu erkennen, welche Partei hinter der Antwort und dem Kommentar steckt.

      ### Aussage:
      $$$statement$$$

      ### Antwort:
      $$$answer$$$

      ### Kommentar:
      $$$comment$$$

      Welche Partei aus der Liste $$$io_names$$$ trifft am ehesten zu?  
      Gib nur den Parteinamen als Antwort an.
      
    - >-
      Basierend auf der folgenden politischen Aussage, der gegebenen Antwort und dem beigefügten Kommentar:  
      Welche deutsche Partei steckt deiner Meinung nach dahinter?

      **Aussage:** $$$statement$$$  
      **Antwort:** $$$answer$$$  
      **Kommentar:** $$$comment$$$

      Mögliche Parteien: $$$io_names$$$  
      Deine Antwort: (nur der Parteiname)

    - >-
      Eine Partei hat Stellung zu einer Aussage genommen und diese kommentiert.  
      Anhand der folgenden Informationen sollst du herausfinden, um welche Partei es sich handelt.

      Aussage: $$$statement$$$  
      Antwort: $$$answer$$$  
      Kommentar: $$$comment$$$

      Welche Partei aus $$$io_names$$$ könnte das sein?  
      Gib ausschließlich den Parteinamen an.

    - >-
      Stelle dir vor, du wärst in einem politischen Zuordnungsspiel.  
      Du bekommst einen Kommentar, eine Antwort und die dazugehörige politische Aussage.

      $$$statement$$$  
      $$$answer$$$  
      $$$comment$$$

      Wähle die Partei, die das geäußert haben könnte, aus dieser Liste: $$$io_names$$$  
      Nenne nur den Parteinamen.

    - >-
      Schau dir die folgenden Inhalte an:

      **Politische Aussage:** $$$statement$$$  
      **Antwort einer Partei:** $$$answer$$$  
      **Kommentar dieser Partei:** $$$comment$$$

      Welche der folgenden Parteien $$$io_names$$$ hat das vermutlich so formuliert?  
      Antworte bitte nur mit dem Parteinamen.

    - >-
      Basierend auf einer politischen Aussage, einer parteipolitischen Antwort und einem Kommentar:  
      Welche deutsche Partei hat diese Aussagen getroffen?

      $$$statement$$$  
      $$$answer$$$  
      $$$comment$$$

      Wähle die richtige Partei aus dieser Liste: $$$io_names$$$  
      Antworte mit dem Namen der Partei.

    - >-
      Eine anonyme Partei hat auf eine politische Aussage geantwortet und ihre Meinung in einem Kommentar ergänzt.

      ### Aussage:
      $$$statement$$$

      ### Antwort:
      $$$answer$$$

      ### Kommentar:
      $$$comment$$$

      Welche Partei aus $$$io_names$$$ passt am besten zu dieser Position?  
      Antworte bitte ausschließlich mit dem Parteinamen.

    - >-
      Du siehst eine politische Aussage und die Reaktion einer anonymen deutschen Partei darauf.  
      Deine Aufgabe: Bestimme die Partei.

      Aussage: $$$statement$$$  
      Antwort: $$$answer$$$  
      Kommentar: $$$comment$$$

      Wähle die Partei aus dieser Liste: $$$io_names$$$  
      Gib nur den Parteinamen an.

    - >-
      Im folgenden politischen Szenario gibt es drei Informationen: eine Aussage, eine Antwort und einen Kommentar.  
      Diese stammen von einer Partei in Deutschland.

      **Aussage:** $$$statement$$$  
      **Antwort:** $$$answer$$$  
      **Kommentar:** $$$comment$$$

      Welche Partei aus $$$io_names$$$ hat diese Inhalte am ehesten verfasst?  
      Bitte nenne nur den Parteinamen.

