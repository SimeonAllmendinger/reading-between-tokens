      Op basis van de onderstaande politieke uitspraak, het gegeven antwoord en de bijgevoegde toelichting:  
      Welke Nederlandse partij zit hier waarschijnlijk achter?

      **Uitspraak:** $$$statement$$$  
      **Antwoord:** $$$answer$$$  
      **Toelichting:** $$$comment$$$

      Mogelijke partijen: $$$io_names$$$  
      Jouw antwoord: (alleen de naam van de partij)

    - >-
      Een partij heeft zich uitgesproken over een bepaalde stelling en daar een toelichting bij gegeven.  
      Aan de hand van de volgende informatie moet je achterhalen om welke partij het gaat.

      Uitspraak: $$$statement$$$  
      Antwoord: $$$answer$$$  
      Toelichting: $$$comment$$$

      Welke partij uit $$$io_names$$$ zou dit gezegd kunnen hebben?  
      Antwoord uitsluitend met de naam van de partij.

    - >-
      Stel je voor dat je een politieke matching-quiz speelt.  
      Je krijgt een toelichting, een antwoord en de bijbehorende uitspraak.

      $$$statement$$$  
      $$$answer$$$  
      $$$comment$$$

      Kies de partij die dit het best verwoord zou kunnen hebben, uit deze lijst: $$$io_names$$$  
      Noem enkel de partijnaam.

    - >-
      Bekijk de volgende inhoud:

      **Politieke uitspraak:** $$$statement$$$  
      **Antwoord van een partij:** $$$answer$$$  
      **Toelichting van die partij:** $$$comment$$$

      Welke van de volgende partijen $$$io_names$$$ zou dit geformuleerd kunnen hebben?  
      Antwoord alleen met de naam van de partij.

    - >-
      Gebaseerd op een politieke uitspraak, een partijreactie en een toelichting:  
      Welke Nederlandse partij heeft deze uitspraken gedaan?

      $$$statement$$$  
      $$$answer$$$  
      $$$comment$$$

