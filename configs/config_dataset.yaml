    - >-
      Lees de volgende politieke uitspraak en de reactie van een anonieme partij daarop.  
      Jouw taak is te bepalen welke partij achter het antwoord en de toelichting zit.

      ### Uitspraak:
      $$$statement$$$

      ### Antwoord:
      $$$answer$$$

      ### Toelichting:
      $$$comment$$$

      Welke partij uit de lijst $$$io_names$$$ past hier het best bij?  
      Geef enkel de naam van de partij als antwoord.

