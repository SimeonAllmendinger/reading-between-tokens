      ### Uitspraak:
      $$$statement$$$

      ### Antwoord:
      $$$answer$$$

      ### Toelichting:
      $$$comment$$$

      Welke partij uit $$$io_names$$$ past het best bij deze positie?  
      Antwoord uitsluitend met de naam van de partij.

